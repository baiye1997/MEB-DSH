<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 470" role="img" aria-labelledby="title desc">
  <title id="title">在 DSH Desktop 添加 MEB 插件</title>
  <desc id="desc">安装步骤：打开添加插件，输入 meb-workbench，安装并打开工作台。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1424"/><stop offset="1" stop-color="#19385c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1600" height="470" rx="28" fill="url(#bg)"/>
  <text x="74" y="76" fill="#eef7ff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="700">三步开始使用 MEB</text>
  <text x="74" y="108" fill="#a3bed8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15">在 DSH Desktop 中安装，无需先安装插件市场。</text>
  <g filter="url(#shadow)">
    <rect x="74" y="154" width="424" height="230" rx="20" fill="#f7faff"/>
    <circle cx="120" cy="202" r="21" fill="#2865b0"/><text x="113" y="210" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">1</text>
    <text x="160" y="207" fill="#172f4c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700">打开添加插件</text>
    <text x="112" y="252" fill="#667e99" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14">在插件管理中选择：</text>
    <rect x="112" y="268" width="346" height="48" rx="10" fill="#eaf2fb"/><text x="132" y="299" fill="#1b4e84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18">添加插件</text>
    <text x="112" y="350" fill="#7289a2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12">使用 DSH 自带的安装入口</text>

    <rect x="588" y="154" width="424" height="230" rx="20" fill="#f7faff"/>
    <circle cx="634" cy="202" r="21" fill="#2865b0"/><text x="627" y="210" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">2</text>
    <text x="674" y="207" fill="#172f4c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700">输入包名</text>
    <text x="626" y="252" fill="#667e99" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14">输入：</text>
    <rect x="626" y="268" width="346" height="48" rx="10" fill="#eaf2fb"/><text x="646" y="299" fill="#1b4e84" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">meb-workbench</text>
    <text x="626" y="350" fill="#7289a2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12">选择安装源，确认包名和版本</text>

    <rect x="1102" y="154" width="424" height="230" rx="20" fill="#f7faff"/>
    <circle cx="1148" cy="202" r="21" fill="#2865b0"/><text x="1141" y="210" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">3</text>
    <text x="1188" y="207" fill="#172f4c" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700">安装并打开</text>
    <text x="1140" y="252" fill="#667e99" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14">安装完成后，从左侧打开：</text>
    <rect x="1140" y="268" width="346" height="48" rx="10" fill="#eaf2fb"/><text x="1160" y="299" fill="#1b4e84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18">MEB 工作台</text>
    <text x="1140" y="350" fill="#7289a2" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12">按 DSH 提示刷新或重新启动</text>
  </g>
  <path d="M518 269h50M1032 269h50" stroke="#78c7ff" stroke-width="3" stroke-linecap="round"/><path d="M555 256l14 13-14 13M1069 256l14 13-14 13" fill="none" stroke="#78c7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
