<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>项目模型预览</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#e0eafa;background:#0b1422;font-synthesis:none;--accent:#2865b0;--muted:#9aabc1;--line:#22344b}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;color:inherit;border:1px solid #354e6d;background:#10233a;padding:10px 15px;border-radius:5px;min-height:42px}button:hover{background:#203a59;border-color:#6899d0}button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#f3f8ff}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid #a9d3ff;outline-offset:3px}header{height:100px;padding:23px 32px;display:flex;align-items:center;justify-content:space-between;background:#101c2d;border-bottom:1px solid var(--line)}h1{font-size:26px;letter-spacing:-.025em;margin:0;font-weight:600}header p{margin:7px 0 0;color:var(--muted);font-size:13px}.edition{font-size:12px;color:var(--muted);text-align:right;line-height:1.8}.workspace{display:grid;grid-template-columns:264px minmax(0,1fr);height:calc(100dvh - 100px);min-height:520px}aside{background:#101c2d;padding:29px 24px;overflow:auto;border-right:1px solid var(--line)}h2{font-size:14px;font-weight:600;margin:0 0 16px}aside section+section{margin-top:29px;padding-top:24px;border-top:1px solid var(--line)}.building{margin:20px 0}.building strong{display:block;font-size:14px;font-weight:550}.building p{margin:7px 0 0 17px;font-size:12px;line-height:1.7;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:9px;background:#66afff}.dot.old{background:#afc3df}.pending{color:#e3bd7e;font-size:11px;display:inline-block;margin-left:17px;margin-top:5px}label.option{display:flex;align-items:center;gap:10px;font-size:13px;margin:15px 0}input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}input[type=range]{width:100%;accent-color:var(--accent);margin-top:15px}.light-label{display:flex;justify-content:space-between;font-size:13px}.note{font-size:12px;line-height:1.85;color:var(--muted)}.stage{position:relative;min-width:0;display:flex;flex-direction:column;background:#0b1525}.toolbar{padding:20px 24px;display:flex;justify-content:space-between;gap:12px;z-index:2}.segmented{display:flex;gap:5px}.view-actions{display:flex;gap:7px}#viewport{position:relative;flex:1;min-height:350px;overflow:hidden;touch-action:none}canvas{position:absolute;inset:0;display:block;width:100%;height:100%;cursor:grab}canvas:active{cursor:grabbing}.model-label{position:absolute;transform:translate(-50%,-100%);pointer-events:none;white-space:nowrap;background:#10233a;padding:7px 11px;border:1px solid #5182b4;border-radius:3px;color:#c9e4ff;font-size:12px}.model-label.existing{color:#d4e0f2;border-color:#657e9d}.zoom{position:absolute;bottom:28px;right:24px;display:flex;align-items:center;gap:6px}.zoom button{width:44px;padding:4px;font-size:23px}.stage-footer{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 24px 21px;font-size:12px;color:#b5c9e0}.hint{font-size:12px;margin-top:6px;color:#99afca}#view-status{font-variant-numeric:tabular-nums;white-space:nowrap}.disclaimer{padding:13px 24px;border-top:1px solid #22344b;font-size:12px;line-height:1.7;color:#a2b6d0;background:#0e1a2a}#loading,#error{position:absolute;top:40%;left:15%;right:15%;text-align:center;background:#12253d;padding:20px;color:#cee5ff}#error{color:#ffaf9b}noscript{display:block;padding:30px}[hidden]{display:none!important}@media(max-width:900px){.workspace{grid-template-columns:220px minmax(0,1fr)}aside{padding:23px 18px}.toolbar{padding:16px 14px;flex-wrap:wrap}.stage-footer{padding:14px;align-items:flex-start;flex-direction:column;gap:10px}}@media(max-width:640px){header{height:90px;padding:18px 20px}h1{font-size:23px}.edition{display:none}.workspace{display:flex;flex-direction:column;height:auto;min-height:calc(100dvh - 90px)}.stage{order:0;height:70dvh;min-height:520px}aside{order:1;border-right:0;border-top:1px solid var(--line);overflow:visible;padding:24px}.toolbar{gap:10px}.toolbar button{padding:8px 12px}#viewport{min-height:260px}.stage-footer{padding:12px 16px;gap:5px}.hint{font-size:11px}.disclaimer{padding:12px 16px}.zoom{bottom:16px;right:14px}.model-label{font-size:10px;padding:5px 7px}aside section+section{margin-top:20px;padding-top:20px}}

html.model-empty,html.model-empty body,.model-empty .stage{background:#f5f6f7;color:#454d53}.model-empty :is(.toolbar,.zoom,.stage-footer,.disclaimer,aside,header){display:none!important}.model-empty .workspace{display:block;height:100dvh;min-height:0}.model-empty .stage{height:100%}.model-empty #viewport{min-height:0}.model-empty #error{background:transparent;color:#586269;border:0;font-size:14px;line-height:1.7}
</style></head>
<body>
<header><div><h1>项目模型</h1><p>楼栋与楼层预览</p></div></header>
<main class="workspace"><aside aria-label="模型资料与显示设置">

<section><h2>显示与光照</h2><label class="option"><input id="levels" type="checkbox" checked>楼层分界线</label><label class="option"><input id="labels" type="checkbox" checked>楼栋标签</label><label class="option"><input id="grid" type="checkbox" checked>参考网格 · 10 m</label><div class="light-label"><label for="light">光照方向</label><output id="light-value" for="light">125°</output></div><input id="light" type="range" min="0" max="180" value="125" step="5"><details><summary>显示说明</summary><p class="note">楼层线来自当前配置。<br>网格为展示坐标参考，非测量成果。<br>光影为体块审阅效果，非日照分析。</p></details></section>
<section><details><summary>建模与计量说明</summary><p class="note">模型仅表达已配置的体量与位置，不代替设计图纸或施工级 BIM；工程量仍需人工核对。</p></details></section>
</aside><section class="stage" aria-label="交互沙盘">
<nav class="toolbar" aria-label="沙盘视图"><div class="segmented" role="group" aria-label="建筑分期筛选"><button data-phase="all" aria-pressed="true">全部</button><button data-phase="one" aria-pressed="false">一期</button><button data-phase="two" aria-pressed="false">二期</button></div><div class="view-actions"><button id="top">俯视</button><button id="reset">复位</button></div></nav>
<div id="viewport"><p id="loading" role="status">正在构建三维沙盘…</p><p id="error" role="alert" hidden></p><noscript>请启用 JavaScript 以显示和操作三维沙盘。</noscript><div class="zoom" role="group" aria-label="缩放"><button id="zoom-out" aria-label="缩小">−</button><button id="zoom-in" aria-label="放大">+</button></div></div>
<div class="stage-footer"><div><strong id="phase-status">项目模型</strong><div class="hint">拖动旋转 · 滚轮 / 双指缩放 · 聚焦画布后方向键旋转、R 复位</div></div><span id="view-status" aria-label="当前视角"></span></div>
<div class="disclaimer">模型来源于当前项目配置；请核对轮廓、楼层与单位。</div>
</section></main><script>/* BUNDLE */</script></body></html>
