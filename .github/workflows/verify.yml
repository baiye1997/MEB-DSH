name: Verify

on:
  push:
    branches: [main]
    paths:
      - 'workbench/**'
      - '!workbench/**/*.md'
      - '.github/workflows/verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'workbench/**'
      - '!workbench/**/*.md'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - name: Install locked dependencies without rebuilding
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and validate the distributable
        run: npm run verify:ci
